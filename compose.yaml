name: tarot-tg-bot

services:
  bot:
    container_name: tarot-bot
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '10000'), timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
